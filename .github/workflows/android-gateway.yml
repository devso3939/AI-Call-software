name: android-gateway-apk

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/android-gateway/**'
      - '.github/workflows/android-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      # SIGNED RELEASE build — consistent keystore committed in the repo means:
      #   * same signature on every build (updates install over old versions)
      #   * properly signed release APK (not a debug build), which is what
      #     Play Protect expects — this is the fix for the install-block warning
      - name: Build signed release APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      # Verify the APK really is signed with the schemes modern Android checks.
      # NOTE: AGP auto-disables v1 (JAR) signing when minSdk >= 24 — v1 is only
      # needed on Android 6 and older, and this app requires Android 8+. So the
      # correct coverage for THIS app is v2 (Android 7+) + v3.
      - name: Verify APK signature (v2 + v3)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Verifying: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK" | tee sig.txt
          # apksigner prints: "Verified using v2 scheme (APK Signature Scheme v2): true"
          grep -Eq "Verified using v2 scheme.*: true" sig.txt || (echo "v2 scheme missing" && exit 1)
          grep -Eq "Verified using v3 scheme.*: true" sig.txt || (echo "v3 scheme missing" && exit 1)
          echo "Signature OK: v2 + v3 cover all supported devices (Android 8.0+)"

      # Give the APK a stable filename so the download URL never changes:
      #   https://github.com/devso3939/AI-Call-software/releases/latest/download/opencall-gateway.apk
      - name: Rename APK to stable filename
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            [ -e "$f" ] || continue
            case "$f" in opencall-gateway.apk) continue;; esac
            cp "$f" opencall-gateway.apk
          done
          ls -la

      # Rolling "latest" release: every build REPLACES the single latest release,
      # so the URL above ALWAYS serves the newest signed APK.
      - name: Publish to rolling 'latest' release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OpenCall Gateway — latest APK
          body: |
            **Always up to date.** This release is replaced automatically on every
            build, so the download link always gives you the newest
            OpenCall Gateway APK (v1.2.0 · versionCode 3).

            ### Signed release build (v2 + v3 signature schemes)
            This APK is **code-signed with a consistent release key** verified for
            the modern Android signing schemes (v2 + v3, covering Android 7 → 15+;
            v1/JAR is legacy-only and not used since the app requires Android 8+) —
            updates install cleanly over previous versions, and it satisfies
            modern Android (Play Protect) requirements for sideloading.

            ### ⚠️ First install — Play Protect note
            If Android shows **"Blocked for your protection"**, that is Google's
            standard warning for ANY app outside the Play Store (not a defect).
            Tap **More details → Install anyway**. Full step-by-step guide for
            every phone brand: **https://devso3939.github.io/AI-Call-software/install.html**

            ### Install
            1. Download `opencall-gateway.apk` on your Android phone
            2. Open it → follow the guide above if Play Protect asks
            3. Open the app → enter the 6-digit pairing code from the web app's **Devices** tab → Pair
            4. Tap **Start gateway**

            ### No APK? Install the web app instead (zero warnings)
            Open https://devso3939.github.io/AI-Call-software/app.html in Chrome
            and tap **📲 Install OpenCall app** — installs like a native app with
            no Play Protect involvement.
          files: apps/android-gateway/app/build/outputs/apk/release/opencall-gateway.apk
          fail_on_unmatched_files: true
