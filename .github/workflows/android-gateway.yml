name: android-gateway-apk

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/android-gateway/**'
      - '.github/workflows/android-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew || true

      # SIGNED RELEASE builds — same committed keystore for both flavors:
      #   * full → opencall-gateway.apk  (app.opencall.gateway2): SMS + call relay
      #   * lite → opencall-bridge.apk   (app.opencall.bridge):  mic-only bridge,
      #     ZERO sensitive permissions → Play Protect's financial-fraud scan has
      #     nothing to trigger on → installs without the warning.
      - name: Build signed release APKs (full + lite)
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleFullRelease :app:assembleLiteRelease --no-daemon
          else
            gradle :app:assembleFullRelease :app:assembleLiteRelease --no-daemon
          fi

      # Verify BOTH APKs really are signed with v2 + v3 (Android 7+ coverage).
      - name: Verify APK signatures (v2 + v3)
        run: |
          for APK in app/build/outputs/apk/full/release/*.apk app/build/outputs/apk/lite/release/*.apk; do
            echo "Verifying: $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK" | tee sig.txt
            grep -Eq "Verified using v2 scheme.*: true" sig.txt || (echo "v2 scheme missing in $APK" && exit 1)
            grep -Eq "Verified using v3 scheme.*: true" sig.txt || (echo "v3 scheme missing in $APK" && exit 1)
          done
          echo "Signatures OK: v2 + v3 cover all supported devices (Android 8.0+)"

      # Also verify the lite APK truly contains NO sensitive permissions
      # (that is the whole point of the lite build).
      - name: Verify lite APK has zero sensitive permissions
        run: |
          APK=$(ls app/build/outputs/apk/lite/release/*.apk | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump permissions "$APK" > perms.txt
          cat perms.txt
          if grep -Eq "android.permission.(SEND_SMS|RECEIVE_SMS|READ_SMS|CALL_PHONE|ANSWER_PHONE_CALLS|READ_PHONE_STATE|READ_PHONE_NUMBERS|RECEIVE_MMS|RECEIVE_WAP_PUSH)" perms.txt; then
            echo "FAIL: lite APK contains sensitive permissions" && exit 1
          fi
          echo "Lite APK clean: no SMS/PHONE permissions declared"

      # Stable filenames so the download URLs never change:
      #   https://github.com/devso3939/AI-Call-software/releases/latest/download/opencall-gateway.apk
      #   https://github.com/devso3939/AI-Call-software/releases/latest/download/opencall-bridge.apk
      - name: Rename APKs to stable filenames
        run: |
          cd app/build/outputs/apk
          FULL_APK=$(ls full/release/*.apk | grep -v opencall-gateway.apk | head -n 1)
          LITE_APK=$(ls lite/release/*.apk | grep -v opencall-bridge.apk | head -n 1)
          cp "$FULL_APK" full/release/opencall-gateway.apk
          cp "$LITE_APK" lite/release/opencall-bridge.apk
          ls -la full/release lite/release

      # Rolling "latest" release: every build REPLACES the single latest release,
      # so the URLs above ALWAYS serve the newest signed APKs.
      - name: Publish to rolling 'latest' release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OpenCall — latest APKs
          body: |
            **Always up to date.** This release is replaced automatically on every
            build (v1.5.4 · versionCode 10). Two APKs:

            | APK | Package | What it does | Play Protect |
            |---|---|---|---|
            | `opencall-bridge.apk` | `app.opencall.bridge` | Internet calling (microphone bridge) — joins call rooms like the web app | ✅ **Installs clean — no sensitive permissions, no warning** |
            | `opencall-gateway.apk` | `app.opencall.gateway2` | FULL gateway: SMS relay in/out + dial/answer SIM calls + audio bridge | ⚠️ May show the sensitive-data warning until the developer identity is registered (see below) |

            ### Why the full gateway shows a warning (and the fix)
            Your exact message — *"This app can request access to sensitive data… Learn more about Play Protect"* — is Google's **financial-fraud prevention** (introduced 2024-2026). It **blocks installation** of unverified apps that request SMS/PHONE permissions from browser sources. It is triggered by the **permission declarations + developer registration status**, NOT by the APK's contents, signature, or version. That is why rebuilding can't remove it, and why registered apps (like other SMS-gateway apps) install silently.

            **The permanent fix: register the app** — free, ~15 minutes:
            1. Go to https://android.google.com/developerconsole/ → sign in with your Google account (enable 2-Step Verification if you haven't) → choose the **free "Limited distribution"** account (no fee, no government ID, up to 20 devices).
            2. Register the package name **`app.opencall.gateway2`** with signing-key SHA-256:
               `03:3C:51:17:75:9D:2A:B2:2B:8C:A6:16:56:76:5B:2D:F1:9B:9D:73:A1:CB:F0:C7:63:A3:F1:76:0E:6B:27:57`
            3. On the **Devices** page, add your phone (scan the QR with the phone → enter the code it shows).
            4. Install `opencall-gateway.apk` — **no warning anymore, on this and every future build.**

            Meanwhile: **OpenCall Bridge needs no registration and installs with no warning** — use it if you only need internet calling. For SMS/SIM-call relay, either register (steps above) or tap **More details → Install anyway** on the warning dialog.

            ### Install (either APK)
            1. Uninstall any older OpenCall app first
            2. Download on your Android phone (Android 8.0+)
            3. Open it → if a dialog appears, see the table above
            4. Enter the 6-digit pairing code from the web app's **Devices** tab → Pair
            5. Full gateway: **Start gateway** · Bridge: **Start bridge**

            ### No APK? Install the web app instead (zero warnings)
            Open https://devso3939.github.io/AI-Call-software/app.html in Chrome
            and tap **📲 Install OpenCall app** — installs like a native app with
            no Play Protect involvement.

            Full guide: **https://devso3939.github.io/AI-Call-software/install.html**
          files: |
            apps/android-gateway/app/build/outputs/apk/full/release/opencall-gateway.apk
            apps/android-gateway/app/build/outputs/apk/lite/release/opencall-bridge.apk
          fail_on_unmatched_files: true
