<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCall AI — Live Web App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.4/dist/twilio.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<style>
  :root{
    --ink950:#070b14;--ink900:rgba(17,24,39,.72);--ink800:#141b29;--ink700:rgba(148,163,184,.14);--ink600:rgba(148,163,184,.22);
    --mint:#10b981;--mint400:#34d399;--mint600:#059669;
    --cyan:#22d3ee;--violet:#a78bfa;
    --sidebar:#0a0f1a;--sidebar-active:rgba(16,185,129,.10);--sidebar-border:rgba(148,163,184,.10);
    --key:rgba(20,27,41,.85);--key-hi:rgba(148,163,184,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;color:#e5eaf3;font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(16,185,129,.14), transparent 60%),
      radial-gradient(900px 480px at 88% -8%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(700px 460px at 50% 112%, rgba(167,139,250,.08), transparent 60%),
      var(--ink950);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased}
  ::selection{background:rgba(16,185,129,.35)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#26334a;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ================= dashboard shell ================= */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:232px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--sidebar-border);
    display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;z-index:40}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;border-bottom:1px solid var(--sidebar-border);margin-bottom:14px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),var(--cyan));
    display:flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:0 4px 16px rgba(16,185,129,.35)}
  .brand h1{font-size:1.02rem;margin:0;letter-spacing:-.02em;line-height:1.1}
  .brand .tiny{display:block;margin-top:1px}
  .sidebtn{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;color:#8b98ad;
    padding:10px 12px;border-radius:11px;font-size:.88rem;font-weight:600;cursor:pointer;text-align:left;
    transition:background .15s,color .15s,transform .15s;font-family:inherit}
  .sidebtn:hover{background:rgba(148,163,184,.07);color:#cbd5e1;transform:translateX(2px)}
  .sidebtn.on{background:var(--sidebar-active);color:var(--mint400);box-shadow:inset 0 0 0 1px rgba(16,185,129,.22)}
  .sidebtn.on::before{content:'';position:absolute;left:-12px;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;
    background:linear-gradient(180deg,var(--mint),var(--cyan))}
  .sidebtn .ico{font-size:1rem;width:22px;text-align:center;flex-shrink:0}
  .sidebtn .badge{margin-left:auto;background:var(--mint);color:#04110c;border-radius:999px;font-size:.65rem;font-weight:700;padding:1px 7px}
  .sidefoot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--sidebar-border)}
  .userchip{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .avatar{width:34px;height:34px;border-radius:999px;background:linear-gradient(135deg,#1e293b,#334155);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:var(--mint400);
    border:1px solid rgba(16,185,129,.30);flex-shrink:0}
  .userchip .meta{min-width:0}
  .userchip .meta strong{display:block;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .userchip .meta .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{flex:1;min-width:0;padding:22px 26px 110px;max-width:1060px}
  .pagetitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
  .pagetitle h2{font-size:1.25rem;margin:0;letter-spacing:-.02em}
  .pagetitle .sub{margin:2px 0 0;font-size:.82rem;color:#94a3b8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2 .span2{grid-column:1 / -1}
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 60px rgba(0,0,0,.6)}
    .sidebar.open{transform:translateX(0)}
    .shell{display:block}
    .main{padding:16px 14px 110px;max-width:100%}
    .grid2{grid-template-columns:1fr}
    .menutoggle{display:inline-flex !important}
  }
  .menutoggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
    border:1px solid var(--ink600);background:rgba(20,27,41,.8);color:#cbd5e1;cursor:pointer;font-size:1rem}
  .sideback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
  .sideback.show{display:block}

  h1{font-size:1.3rem;margin:0;letter-spacing:-.02em}
  h2{font-size:1.02rem;margin:0 0 8px;letter-spacing:-.01em}
  .card{border-radius:18px;border:1px solid var(--ink700);background:var(--ink900);padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(0,0,0,.35)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .muted{color:#94a3b8;font-size:.85rem}
  .tiny{font-size:.75rem;color:#64748b}
  .mint{color:var(--mint400)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-size:.9rem;font-weight:650;cursor:pointer;border:1px solid transparent;transition:background .15s,transform .15s,box-shadow .15s,border-color .15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--mint),var(--cyan));color:#04110c;box-shadow:0 6px 22px rgba(16,185,129,.30)}
  .btn-primary:hover:not(:disabled){box-shadow:0 10px 30px rgba(16,185,129,.45);transform:translateY(-1px)}
  .btn-primary:active:not(:disabled){transform:translateY(0) scale(.98)}
  .btn-ghost{background:rgba(148,163,184,.07);border-color:var(--ink600);color:#cbd5e1}
  .btn-ghost:hover:not(:disabled){background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.32)}
  .btn-danger{background:#dc2626;color:#fff}
  .btn-danger:hover{background:#ef4444}
  .input{width:100%;border-radius:12px;border:1px solid var(--ink600);background:rgba(20,27,41,.8);padding:10px 12px;color:#e5eaf3;font-size:.95rem;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
  .input:focus{border-color:var(--mint600);box-shadow:0 0 0 3px rgba(16,185,129,.18);background:rgba(23,31,48,.9)}
  .input::placeholder{color:#556379}
  .label{display:block;font-size:.75rem;color:#94a3b8;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .banner{border-radius:14px;border:1px solid rgba(52,211,153,.4);background:rgba(16,185,129,.08);padding:12px 14px;font-size:.85rem;margin-bottom:12px;backdrop-filter:blur(8px)}
  .err{border-radius:10px;background:rgba(127,29,29,.55);padding:10px 12px;font-size:.85rem;color:#fecaca;margin:10px 0}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink700)}
  th{color:#8b98ad;font-weight:600;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;
    border-bottom:1px solid var(--ink600);background:rgba(10,15,26,.5)}
  th:first-child{border-radius:10px 0 0 0}
  th:last-child{border-radius:0 10px 0 0}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(148,163,184,.055)}
  tbody tr:last-child td{border-bottom:none}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:600}
  .pill.completed{background:rgba(16,185,129,.15);color:var(--mint400)}
  .pill.ringing,.pill.active,.pill.answered{background:rgba(52,211,153,.25);color:var(--mint400)}
  .pill.failed,.pill.cancelled,.pill.rejected,.pill.no_answer{background:rgba(220,38,38,.15);color:#fca5a5}
  .pill.queued{background:rgba(251,191,36,.15);color:#fcd34d}
  .pill.sent,.pill.delivered{background:rgba(16,185,129,.15);color:var(--mint400)}
  .pill.created,.pill.dialing{background:rgba(251,191,36,.15);color:#fcd34d}
  .contact{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--ink700);border-radius:14px;background:rgba(20,27,41,.7);padding:10px 12px;margin-bottom:8px;transition:border-color .15s,background .15s,transform .15s}
  .contact:hover{border-color:rgba(52,211,153,.35);background:rgba(23,31,48,.8);transform:translateY(-1px)}

  /* ================= professional dialer keypad ================= */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;max-width:320px;margin-left:auto;margin-right:auto}
  .key{aspect-ratio:1;border-radius:999px;border:1px solid var(--ink700);background:var(--key);
    color:#e5eaf3;font-size:1.5rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;line-height:1;transition:background .12s,transform .08s,border-color .12s;
    -webkit-tap-highlight-color:transparent;user-select:none;font-family:inherit}
  .key small{display:block;font-size:.5rem;font-weight:600;letter-spacing:.18em;color:#64748b;margin-top:4px;text-transform:uppercase}
  .key:hover{background:var(--key-hi);border-color:rgba(52,211,153,.4)}
  .key:active{transform:scale(.94);background:rgba(16,185,129,.15);border-color:var(--mint600)}
  .dial-display{min-height:56px;border-radius:16px;border:1px solid var(--ink600);background:rgba(20,27,41,.8);
    display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 16px;cursor:text;overflow-x:auto}
  .dial-display .num{font-size:1.45rem;font-weight:600;letter-spacing:.05em;white-space:nowrap}
  .dial-display .caret{width:2px;height:26px;background:var(--mint400);border-radius:2px;animation:pulse 1.1s ease-in-out infinite}
  .dial-display .ph{color:#556379;font-size:1rem;font-weight:400}
  .callbtn{width:64px;height:64px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--mint),var(--cyan));
    color:#04110c;font-size:1.55rem;cursor:pointer;box-shadow:0 8px 28px rgba(16,185,129,.40);display:flex;
    align-items:center;justify-content:center;margin:16px auto 0;transition:transform .12s,box-shadow .15s;flex-shrink:0}
  .callbtn:hover:not(:disabled){transform:scale(1.06);box-shadow:0 12px 34px rgba(16,185,129,.55)}
  .callbtn:active:not(:disabled){transform:scale(.97)}
  .callbtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .callbtn.end{background:#dc2626;color:#fff;box-shadow:0 8px 28px rgba(220,38,38,.40)}
  .keypadwrap{display:flex;flex-direction:column;align-items:center}

  /* ================= in-call dialpad (web call controls) ================= */
  .keypad.small{max-width:268px;margin-top:10px}
  .keypad.small .key{aspect-ratio:auto;height:52px;font-size:1.25rem}
  .banner-audio{width:100%;margin-top:10px;border-radius:10px;outline:none}

  /* ================= auth / guest pages ================= */
  .authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;position:relative}
  .authcard{width:100%;max-width:400px;background:var(--ink900);border:1px solid var(--ink700);border-radius:20px;
    padding:30px 28px 24px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:fadein .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .authcard .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--mint),var(--cyan));
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 14px;box-shadow:0 6px 24px rgba(16,185,129,.4)}
  .authcard h1{font-size:1.45rem;margin:0;text-align:center;letter-spacing:-.02em}
  .authcard .tagline{text-align:center;color:#94a3b8;font-size:.85rem;margin:6px 0 22px}
  .authbadge{display:flex;justify-content:center;margin-bottom:18px}
  .authbadge span{font-size:.72rem;font-weight:600;color:var(--mint400);background:rgba(16,185,129,.10);
    border:1px solid rgba(16,185,129,.28);border-radius:999px;padding:4px 14px}
  .demobox{background:rgba(20,27,41,.6);border:1px solid var(--ink700);border-radius:12px;padding:12px 14px;margin-top:16px}
  .demobox p{margin:0 0 10px;font-size:.75rem;color:#94a3b8}
  .authfoot{text-align:center;margin:16px 0 0;font-size:.72rem;color:#64748b}
  .authfoot a{color:#8b98ad}
  .guestavatar{width:76px;height:76px;border-radius:999px;background:linear-gradient(135deg,#1e293b,#334155);
    display:flex;align-items:center;justify-content:center;font-size:1.9rem;color:var(--mint400);font-weight:700;
    margin:0 auto 14px;border:1px solid rgba(52,211,153,.35);box-shadow:0 0 40px rgba(16,185,129,.18)}
  .guestbadge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--mint400);
    background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.28);border-radius:999px;padding:4px 14px;margin-bottom:14px}
  .guesthint{display:flex;flex-direction:column;gap:8px;margin:18px 0 4px}
  .guesthint div{display:flex;align-items:center;gap:9px;font-size:.8rem;color:#94a3b8;text-align:left}
  .guesthint .ic{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:rgba(20,27,41,.8);
    border:1px solid var(--ink700);display:flex;align-items:center;justify-content:center;font-size:.85rem}

  /* ================= active call overlay ================= */
  .callstage{position:fixed;inset:0;background:rgba(7,11,20,.97);z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:fadein .25s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .callstage .ring{width:92px;height:92px;border-radius:999px;background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(34,211,238,.18));
    display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:18px;
    border:1px solid rgba(52,211,153,.4);box-shadow:0 0 60px rgba(16,185,129,.25)}
  .callstage .ring.pulse{animation:ringpulse 1.4s ease-in-out infinite}
  @keyframes ringpulse{0%,100%{box-shadow:0 0 40px rgba(16,185,129,.22)}50%{box-shadow:0 0 90px rgba(16,185,129,.5);transform:scale(1.04)}}
  .callstage h3{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
  .callstage .cstate{color:#94a3b8;font-size:.9rem;margin:0 0 26px}
  .callstage .cbtns{display:flex;gap:16px;align-items:center}
  .cbig{width:66px;height:66px;border-radius:999px;border:none;font-size:1.5rem;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:transform .12s,box-shadow .15s}
  .cbig:hover{transform:scale(1.07)}
  .cbig.accept{background:linear-gradient(135deg,var(--mint),var(--cyan));color:#04110c;box-shadow:0 8px 30px rgba(16,185,129,.45)}
  .cbig.decline{background:#dc2626;color:#fff;box-shadow:0 8px 30px rgba(220,38,38,.40)}
  .cbig.ctrl{background:rgba(148,163,184,.10);border:1px solid var(--ink600);color:#cbd5e1;width:56px;height:56px;font-size:1.2rem}
  .cbig.ctrl.active{background:rgba(220,38,38,.2);border-color:rgba(220,38,38,.5)}
  .cbig.end{background:#dc2626;color:#fff;box-shadow:0 8px 30px rgba(220,38,38,.40)}
  .callstage .quality{position:absolute;top:22px;right:26px;display:flex;align-items:center;gap:8px;font-size:.8rem;color:#94a3b8}
  .callstage .route{position:absolute;top:22px;left:26px;font-size:.78rem;color:#64748b}
  .callstage .timers{font-variant-numeric:tabular-nums;font-size:.95rem;color:#cbd5e1;margin:-14px 0 22px}

  /* ── 1.5.9 floating call popup — premium phone-app look ── */
  .bigcall{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
    padding:20px;pointer-events:none}
  .bigcall::before{content:'';position:absolute;inset:0;background:rgba(5,8,15,.66);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);animation:fadein .25s}
  .callcard{position:relative;pointer-events:auto;width:100%;max-width:380px;
    background:linear-gradient(165deg,rgba(23,31,48,.98),rgba(9,13,22,.99) 68%);
    border:1px solid rgba(148,163,184,.20);border-radius:28px;padding:32px 26px 24px;text-align:center;
    box-shadow:0 40px 110px rgba(0,0,0,.72),0 0 0 1px rgba(16,185,129,.06),0 0 80px rgba(16,185,129,.08);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:callpop .38s cubic-bezier(.2,.9,.3,1.15)}
  @keyframes callpop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
  .callavatar{position:relative;width:88px;height:88px;border-radius:999px;margin:0 auto 16px;
    background:linear-gradient(135deg,rgba(16,185,129,.30),rgba(34,211,238,.20));
    display:flex;align-items:center;justify-content:center;font-size:2.1rem;font-weight:700;
    border:1px solid rgba(52,211,153,.45);box-shadow:0 0 60px rgba(16,185,129,.25),inset 0 0 24px rgba(16,185,129,.10)}
  .callavatar::after{content:'';position:absolute;inset:-7px;border-radius:999px;
    border:1px solid rgba(52,211,153,.18);animation:avatarbreathe 3s ease-in-out infinite}
  @keyframes avatarbreathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
  .callavatar.pulse{animation:ringpulse 1.4s ease-in-out infinite}
  .callname{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  .callmeta{color:#94a3b8;font-size:.82rem;margin:0 0 4px}
  .callqrow{display:flex;align-items:center;justify-content:center;gap:7px;font-size:.75rem;color:#94a3b8;margin:2px 0 0}
  .calltimerline{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:800;color:#fff;margin:12px 0 18px;letter-spacing:.02em}
  .callctrls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .callctrls .btn{border-radius:999px;padding:11px 18px;transition:transform .15s,background .2s,box-shadow .2s}
  .callctrls .btn:hover:not(:disabled){transform:translateY(-2px)}
  .callbadge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;
    border-radius:999px;padding:4px 12px;margin-bottom:10px}
  .callbadge.rec{color:#fca5a5;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.35)}
  .callbadge.hold{color:#fbbf24;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.32)}
  .callbadge.gw{color:var(--mint400);background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.28)}
  .callnote{font-size:.75rem;color:#b45309;margin:6px 0 0}
  .callhint{font-size:.75rem;color:var(--mint400);margin:6px 0 0}
  .callendbtn{width:100%;max-width:300px;margin:16px auto 0;padding:14px;border-radius:999px;border:none;
    background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;
    box-shadow:0 12px 34px rgba(225,29,72,.38);transition:transform .15s,box-shadow .2s}
  .callendbtn:hover{transform:scale(1.03);box-shadow:0 14px 40px rgba(225,29,72,.5)}
  .callendbtn:active{transform:scale(.98)}
  .callbtnsrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}

  .qdot{width:10px;height:10px;border-radius:999px;background:#64748b;display:inline-block}
  .qdot.excellent{background:var(--mint400)}
  .qdot.good{background:#fbbf24}
  .qdot.poor{background:#ef4444}
  a{color:var(--mint400)}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  pre.code{background:rgba(5,8,15,.85);border:1px solid var(--ink700);border-radius:10px;padding:12px;font-size:.75rem;line-height:1.5;overflow-x:auto;margin:8px 0 4px;color:#a5f3fc;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .copybtn{background:rgba(148,163,184,.08);border:1px solid var(--ink600);color:#cbd5e1;border-radius:8px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer;transition:background .15s}
  .copybtn:hover{background:rgba(148,163,184,.16)}

   Backend:   Supabase (Auth + Postgres RPCs + Realtime)
   Media:     browser-to-browser WebRTC audio (real, P2P)
   ON-NET:    free internet calls between OpenCall users + guests

              in Postgres (secrets never touch the browser);
              TwiML App webhook dials the PSTN number.
   GATEWAY:   your own Android phone = free SMS + free real
              cellular calls on your own number, international.
              The phone pairs with a 6-digit code, long-polls a
              command queue (send_sms / dial_call / answer_call /
              end_call) and bridges call audio acoustically
              (speaker + mic + hardware AEC) into this browser
              over WebRTC. Signaling rides the durable calls_events
              table: the phone reads it with its device secret and
              posts back under the zero-uuid gateway sender.
   Signaling: persistent broadcast room per call + durable
              calls_events table polled until ICE connects.
              Non-trickle ICE (SDP carries candidates) so a
              single delivered message is enough to connect.
   ============================================================ */

const SUPABASE_URL = 'https://ijrfqjxdajgoaysazxle.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Af8dsVLpjtO6Mpe3zpmI9Q_odky49Fh';

const RING_TIMEOUT_S = 45;

let pc = null;
let localStream = null;

/* call recording (browser-side, every call type) */
let callRecorder = null;         // CallRecorder instance while a call is live

/* ───────────────── call recorder (1.5.7, fixed 1.5.8) ─────────────────
   Captures BOTH voices of the live call, encodes to MP3 in the browser
   (lamejs, loaded from CDN) and uploads to the private `call-recordings`
   Storage bucket as <call-id>/call.mp3, attached to the call row via
   attach_call_recording. History plays it back with a signed URL.

   GRAPH (singleton, created once per page — a MediaElementSource can be
   attached to remoteAudio only ONCE and survives across calls):

     remoteAudio ──► recTap (MediaElementSource, created once)
                        ├─► recMix (the call bus you actually hear, gain 1)
                        │        └─► speakers
                        └─► recBus (recorder input, gain 1)
     mic ────────────────► recBus
     recBus ──► ScriptProcessor tap ──► chunks ──► MP3

   1.5.8 FIX for silent recordings: recBus previously had gain 0 ("silent
   monitor") AND was the node feeding the recorder — so every captured
   sample was zeroed before it reached the encoder and the MP3s were dead
   air. The gain-0 trick is unnecessary: onaudioprocess never writes the
   output buffer, so proc → destination feeds SILENCE to the speakers while
   still forcing Chrome to pump the callback. recBus now runs at gain 1 and
   carries real signal — far end + our mic — into the recorder. The speaker
   path is untouched (recTap → recMix → destination, gain 1): no double
   audio, no echo, and the recording finally has both voices. */
const recGraph = {
  ctx: null, tap: null, mix: null, bus: null, proc: null, chunks: [], sampleRate: 48000,
};
function recTapAudio() {
  const g = recGraph;
  if (g.ctx) return true;
  try {
    g.ctx = new (window.AudioContext || window.webkitAudioContext)();
    g.sampleRate = g.ctx.sampleRate;
    g.tap = g.ctx.createMediaElementSource(remoteAudio);
    g.mix = g.ctx.createGain(); g.mix.gain.value = 1.0;
    g.tap.connect(g.mix);
    g.mix.connect(g.ctx.destination);           // speakers (what the user hears)
    g.bus = g.ctx.createGain(); g.bus.gain.value = 1.0;   // recorder input — REAL signal (1.5.8 fix)
    g.tap.connect(g.bus);
    g.mix.connect(g.bus);
    g.proc = g.ctx.createScriptProcessor(4096, 1, 1);
    g.proc.onaudioprocess = (e) => {
      if (!callRecorder) return;                 // only capture while a recorder is live
      g.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      // NB: we never write e.outputBuffer → proc outputs silence to the
      // speakers; the destination connection exists only to keep the tap
      // being pulled by Chrome.
    };
    g.bus.connect(g.proc);
    g.proc.connect(g.ctx.destination);
    return true;
  } catch (e) {
    console.warn('recording tap unavailable', e);
    try { g.ctx && g.ctx.close(); } catch {}
    g.ctx = null;
    return false;
  }
}

class CallRecorder {
  constructor() {
    this.recording = false;
    this.failed = false;
  }

  async start(localStream) {
    if (!remoteAudio.srcObject) return false;
    if (!recTapAudio()) return false;
    try { recGraph.ctx.resume(); } catch {}
    // our own voice joins the mix (listen-only calls record the far end only)
    this.localSrc = null;
    try {
      if (localStream && localStream.getAudioTracks().length) {
        this.localSrc = recGraph.ctx.createMediaStreamSource(localStream);
        this.localSrc.connect(recGraph.bus);
      }
    } catch (e) { console.warn('mic tap failed (recording far end only)', e); }
    this.recording = true;
    return true;
  }

  stop() {
    this.recording = false;
    try { this.localSrc && this.localSrc.disconnect(); } catch {}
    this.localSrc = null;
  }

  /** Encode what we captured to MP3 and attach it to the call row. */
  async finish(callId) {
    this.stop();
    const chunks = recGraph.chunks; recGraph.chunks = [];
    if (!callId || !chunks.length) return false;
    try {
      showToast('Preparing call recording…');
      const mp3 = await encodeMp3(chunks, recGraph.sampleRate);
      if (!mp3 || !mp3.length) return false;
      const path = `${callId}/call.mp3`;
      const blob = new Blob([mp3], { type: 'audio/mpeg' });
      const { error: upErr } = await sb.storage.from('call-recordings').upload(path, blob, {
        contentType: 'audio/mpeg', upsert: true,
      });
      if (upErr) { console.warn('recording upload failed', upErr); showToast('Recording upload failed'); return false; }
      const { error: dbErr } = await sb.rpc('attach_call_recording', { p_call_id: callId, p_path: path });
      if (dbErr) { console.warn('attach recording failed', dbErr); return false; }
      showToast('Call recording saved ✓ (see History)');
      return true;
    } catch (e) {
      console.warn('recording finish failed', e);
      return false;
    }
  }
}

/* mono Float32 chunks → MP3 ArrayBuffer via lamejs (loaded from CDN in head) */
async function encodeMp3(chunks, sampleRate) {
  if (typeof lamejs === 'undefined') { console.warn('lamejs not loaded'); return null; }
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const mono = new Float32Array(total);
  let off = 0;
  for (const c of chunks) { mono.set(c, off); off += c.length; }
  // lamejs takes Int16
  const pcm = new Int16Array(total);
  for (let i = 0; i < total; i++) {
    const s = Math.max(-1, Math.min(1, mono[i]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const enc = new lamejs.Mp3Encoder(1, sampleRate, 64);   // mono · 64 kbps speech
  const BLOCK = 1152 * 20;
  const out = [];
  for (let i = 0; i < pcm.length; i += BLOCK) {
    const buf = enc.encodeBuffer(pcm.subarray(i, Math.min(i + BLOCK, pcm.length)));
    if (buf.length) out.push(new Uint8Array(buf));
    // yield so the tab stays responsive on long calls
    if ((i / BLOCK) % 50 === 0) await new Promise(r => setTimeout(r, 0));
  }
  const end = enc.flush();
  if (end.length) out.push(new Uint8Array(end));
  const size = out.reduce((n, u) => n + u.length, 0);
  const ret = new Uint8Array(size);
  off = 0;
  for (const u of out) { ret.set(u, off); off += u.length; }
  return ret;
}

/* start recording once remote audio exists (called on call → active) */
async function startRecordingIfPossible(localStream) {
  if (!call.callId || callRecorder) return;

}

/* PSTN (Twilio Voice SDK) */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* esc() is for HTML content — NOT safe inside inline JS strings: it turns '
   into &#39; which the HTML parser decodes back to ' and breaks the literal.
   jsArg() escapes for the JS-string-inside-an-attribute context. */
const jsArg = s => String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;');

/* ---------------- boot / auth ---------------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    const p = await loadProfile(data.session.user.id);
    if (p) { await enterApp(p); return; }

}

async function loadProfile(uid) {
  const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();

}

async function doLogin(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return error.message;
  const { data } = await sb.auth.getSession();
  const p = await loadProfile(data.session.user.id);
  if (!p) return 'Profile not found for this user — try registering again.';
  await enterApp(p);
  return null;
}

async function doRegister(email, password, displayName) {
  const { error } = await sb.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
  if (error) return error.message;
  let p = null;
  for (let i = 0; i < 5 && !p; i++) {
    await new Promise(r => setTimeout(r, 400));
    const s = (await sb.auth.getSession()).data.session;
    if (s) p = await loadProfile(s.user.id);
  }
  if (!p) return 'Account created but profile is not ready yet — sign in again in a moment.';
  await enterApp(p);
  return null;
}

async function logout() {
  await sb.auth.signOut();
  location.hash = '';
  location.reload();
}

async function enterApp(p) {
  me = p;
  renderApp();
  await Promise.all([refreshHistory(), refreshContacts()]);
  wireRealtime();
  sweep();
  setInterval(sweep, 30000);
  // per-second UI tick — updates ONLY the seconds/elapsed text nodes and the
  // pairing-code countdown. It must NEVER re-render the whole app: a full
  // renderApp() here used to destroy the DOM (and with it your focus and
  // everything you had typed) once a second while a call was live.
  setInterval(uiTick, 1000);
  startBootPoll();
  document.addEventListener('click', () => {
    remoteAudio.play().then(() => {}, () => {});
    // the recording graph rides the same user gesture: a SUSPENDED
    // AudioContext would silence every future call once the tap exists
    if (recGraph.ctx && recGraph.ctx.state === 'suspended') { try { recGraph.ctx.resume(); } catch {} }
  }, { once: true });
  setupPstn();          // check config + register the Twilio device (no-op when PSTN is not configured)
  refreshDevices();     // SIM gateway device list + online status
  refreshSms();         // recent SMS threads
}

/* granular per-second UI update: touches text nodes only, never inputs.
   [data-timer="dur"] → "1m 5s" (popup timer line), [data-timer="secs"] → "42s"
   (dialing/ringing counters). The old code did a FULL renderApp() here every
   second on the Devices tab — that destroyed focus (and any typing) and froze
   the call-popup timer because the popup had no matching class hooks. */
function uiTick() {
  if (call.startedAt) {
    const s = Math.floor((Date.now() - call.startedAt) / 1000);
    document.querySelectorAll('[data-timer]').forEach(el => {
      el.textContent = el.dataset.timer === 'dur' ? fmtDur(s) : s + 's';
    });
  }
  // pairing-code countdown (Devices tab) — targeted text update, never renderApp()
  if (tab === 'devices' && pairingCode) {
    const fresh = Date.now() - pairingAt < 15 * 60000;
    if (!fresh) { pairingCode = null; renderApp(); }          // one-time transition
    else {
      const mins = document.querySelector('[data-pairmins]');
      if (mins) mins.textContent = String(Math.max(0, Math.ceil((15 * 60000 - (Date.now() - pairingAt)) / 60000)));
    }
  }
}

/* ---------------- PSTN: real phone calls (Twilio Voice) ----------------
   The access token is minted inside Postgres — Twilio credentials never
   reach the browser. The token binds our TwiML App; Twilio calls its
   webhook, which returns <Dial callerId><Number>{{To}}</Number></Dial>. */
async function setupPstn() {
  try {
    const { data: cfgOk } = await sb.rpc('pstn_configured');
    pstnConfigured = !!cfgOk;
    if (!pstnConfigured) { renderApp(); return; }
    const { data: cid } = await sb.rpc('pstn_caller_id');
    pstnCallerId = cid || '';
    renderApp();
    await ensureTwilioDevice();
  } catch (e) { pstnConfigured = false; }
}

async function ensureTwilioDevice() {
  if (!pstnConfigured || twilioDevice) return twilioDevice;
  if (typeof Twilio === 'undefined' || !Twilio.Device) { showToast('Voice SDK failed to load — phone calls unavailable'); return null; }
  const { data: token, error } = await sb.rpc('twilio_voice_token');
  if (error || !token) { showToast('Could not get a phone-call token: ' + honestError(error)); return null; }
  twilioDevice = new Twilio.Device(token, {
    codecPreferences: ['opus', 'pcmu'],
    allowIncomingWhileBusy: false,
    closeProtection: false
  });
  twilioDevice.on('registered', () => { twilioReady = true; renderApp(); });
  twilioDevice.on('error', (err) => {
    console.warn('twilio error', err);
    if (call.isPstn && call.phase !== 'idle') {
      setError('Phone error: ' + (err && err.message ? err.message : 'unknown'));
      endPstnCall('failed');
    } else showToast('Phone error: ' + (err && err.message ? err.message : 'unknown'));
  });
  twilioDevice.on('tokenWillExpire', async () => {
    try {
      const { data: t } = await sb.rpc('twilio_voice_token');
      if (t) await twilioDevice.updateToken(t);
    } catch {}
  });
  twilioDevice.on('incoming', (c) => handleTwilioIncoming(c));   // inbound PSTN→browser (future use)
  await twilioDevice.register();
  return twilioDevice;
}

function wireTwilioCall(c) {
  activeTwilioCall = c;
  c.on('ringing', () => {
    if (call.isPstn && call.phase === 'dialing') { call.phase = 'ringing'; renderApp(); sb.rpc('update_pstn_call', { p_call_id: call.callId, p_event: 'ringing', p_call_sid: c.parameters && c.parameters.CallSid }).then(() => {}, () => {}); }
  });
  c.on('accept', () => {
    if (call.isPstn) {
      clearTimeout(ringTimeout); ringTimeout = null;
      call.phase = 'active'; call.startedAt = Date.now();
      call.remoteStream = c.getRemoteStream ? c.getRemoteStream() : null;
      if (call.remoteStream) { remoteAudio.srcObject = call.remoteStream; remoteAudio.play().catch(() => {}); }
      startRecordingIfPossible(localStream);   // 1.5.7: record both voices
      renderApp();
      sb.rpc('update_pstn_call', { p_call_id: call.callId, p_event: 'answered', p_call_sid: c.parameters && c.parameters.CallSid }).then(() => {}, () => {});
    }
  });
  c.on('disconnect', () => { if (call.isPstn) endPstnCall('ended'); });
  c.on('warning', (n) => { if (call.isPstn) call.stateNote = 'network warning: ' + n; renderApp(); });
  c.on('warning-cleared', () => { if (call.isPstn) { call.stateNote = ''; renderApp(); } });
}

/* place a real phone call: DB row first (honest record), then Twilio dials the number */
async function placePstnCall(e164) {
  if (call.phase !== 'idle') { showToast('Already in a call — end it first'); return; }
  const dest = e164.replace(/[\s()-]/g, '');
  if (!/^\+[1-9][0-9]{5,15}$/.test(dest)) { setError('Enter the number in international format, e.g. +995599123456'); return; }
  setError('');
  const { data, error } = await sb.rpc('place_call', { p_destination: dest, p_mode: 'human' });
  if (error) { setError(honestError(error)); renderApp(); return; }
  call = { callId: data.id, phase: 'dialing', remoteName: dest, peerId: null, isGuest: false, isPstn: true,
           quality: 'unknown', rttMs: null, startedAt: Date.now(), routeNote: 'PSTN · real phone call · carrier rates apply', role: 'caller' };
  renderApp();
  try { await ensureTwilioDevice(); } catch (e) { /* error handler covers it */ }
  if (!twilioDevice) { setError('Phone calls are not ready — PSTN may not be configured'); endPstnCall('failed'); return; }
  try {
    const c = await twilioDevice.connect({ params: { To: dest } });
    if (!c) throw new Error('Twilio returned no call');
    wireTwilioCall(c);
    // honest no-answer cap: if nobody picks up in 45 s, hang up (matches ON-NET behavior)
    ringTimeout = setTimeout(() => { if (call.phase !== 'active') { try { activeTwilioCall && activeTwilioCall.disconnect(); } catch {} endPstnCall('no answer after 45 s'); } }, RING_TIMEOUT_S * 1000);
  } catch (e) {
    setError('Could not start the phone call: ' + (e && e.message ? e.message : e));
    endPstnCall('failed');
  }
}

async function endPstnCall(reason) {
  clearTimeout(ringTimeout); ringTimeout = null;
  const dur = call.startedAt ? Math.round((Date.now() - call.startedAt) / 1000) : 0;
  const id = call.callId;
  const wasActive = call.phase === 'active';
  stopRecordingAndSave();   // 1.5.7: encode + upload what we captured
  if (activeTwilioCall) { try { activeTwilioCall.disconnect(); } catch {} activeTwilioCall = null; }
  call = { callId:null, phase:'idle', remoteName:'', peerId:null, isGuest:false, isPstn:false,
           quality:'unknown', rttMs:null, startedAt:null, routeNote:'', role:null };
  if (me) renderApp();
  if (id) await sb.rpc('update_pstn_call', { p_call_id: id, p_event: reason === 'ended' && wasActive ? 'completed' : 'failed', p_duration: wasActive ? dur : null, p_call_sid: reason === 'ended' && wasActive ? null : ('client:' + reason) }).then(() => {}, () => {});
  if (me) refreshHistory();
  showToast(reason === 'ended' ? (dur > 5 ? `Call ended · lasted ${fmtDur(dur)}` : 'Call ended') : `Call ${reason}`);
}

/* inbound PSTN→browser is possible later via <Dial><Client> — accept/reject UI comes free with the device */
function handleTwilioIncoming(c) {
  showToast('Incoming phone call (browser client): ' + (c.parameters && (c.parameters.From || c.parameters.Caller) || 'unknown'));
  c.reject();   // honest default: we do not present inbound PSTN UI yet
}

/* ---------------- SIM gateway: your Android = free SMS + cellular calls ----------------
   The paired phone long-polls a command queue; calls bridge audio acoustically
   (speaker + mic + hardware AEC) into this browser over WebRTC. Signaling rides
   the durable calls_events table — the phone reads it with its device secret and
   posts back under the zero-uuid gateway sender, which this browser never mistakes
   for its own echo. */
async function refreshDevices() {
  const { data, error } = await sb.rpc('list_gateway_devices');
  if (!error && data) {
    const next = data;
    // BLINK FIX: the Android heartbeats every few seconds → a gateway_devices
    // realtime UPDATE fires → refreshDevices() re-rendered the whole app even
    // when nothing visible changed (battery % and last_seen drift constantly).
    // Re-render only when the UI-visible subset actually changed.
    const vis = d => ({ id: d.id, name: d.name, sim: d.sim_number, batt: d.battery, ver: d.app_version, seen: d.last_seen_at });
    const visEq = (a, b) => a.length === b.length && a.every((x, i) => { const y = b[i]; return x.id === y.id && x.name === y.name && x.sim === y.sim && x.batt === y.batt && x.ver === y.ver && x.seen === y.seen; });
    const nextVis = next.map(vis);
    const prevVis = gatewayDevices.map(vis);
    if (!visEq(nextVis, prevVis)) { gatewayDevices = next; }
    // compute effective online with heartbeat-freshness (see deviceFresh below)
    const cutoff = Date.now() - 120000;
    const online = next.filter(d => deviceFresh(d, cutoff));
    const bestOnline = online.sort((a, b) => new Date(b.last_seen_at) - new Date(a.last_seen_at))[0] || null;
    const gwChanged = (gatewayOnline?.id || null) !== (bestOnline?.id || null);
    gatewayOnline = bestOnline;
    // lite (app.opencall.bridge) = guided tap-to-dial / tap-to-send handoff;
    // full (app.opencall.gateway2) = automatic dialing + SMS relay
    const v = (gatewayOnline && gatewayOnline.app_version) || '';
    gatewayFlavor = v.includes('-lite') ? 'bridge' : v.includes('-full') ? 'gateway' : gatewayFlavor;
    // 1.5.5+ full build reports e.g. "1.5.5-full": any non-lite full build
    // speaks the in-call command protocol (mute/speaker/hold/dtmf). The DB
    // queue_gateway_command allowlist is the real gate — this just keeps
    // the UI honest for genuinely too-old phones.
    gatewayFull = !v.includes('-lite') && !v.startsWith('1.5.4') && !v.startsWith('1.5.3') && v !== '';
    if (gatewayOnline && pairingCode) { pairingCode = null; showToast('Android device paired ✓'); renderApp(); return; }
    if (!visEq(nextVis, prevVis) || gwChanged) renderApp();   // re-render only on real change
  }
}

function copyText(txt, msg) {
  const done = () => showToast(msg || 'Copied');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}

/* outbound: real cellular call dialed by your Android — free, your caller ID */
async function placeGatewayCall(e164) {
  if (call.phase !== 'idle') { showToast('Already in a call — end it first'); return; }
  const dest = e164.replace(/[\s()-]/g, '');
  if (!/^\+[1-9][0-9]{5,15}$/.test(dest)) { setError('Enter the number in international format, e.g. +995599123456'); return; }
  setError('');
  const { data, error } = await sb.rpc('request_gateway_call', { p_to: dest });
  if (error) { setError(honestError(error)); renderApp(); return; }
  const isBridge = gatewayFlavor === 'bridge';
  call = { callId: data.id, phase: 'dialing', remoteName: dest, peerId: null, isGuest: false, isGateway: true,
           quality: 'unknown', rttMs: null, startedAt: Date.now(),
           routeNote: isBridge
             ? 'FREE · SIM bridge · tap the notification on your phone to dial from your number'
             : 'FREE · SIM gateway · your Android dials from your number',
           role: 'caller' };
  eventSeq = 0;
  renderApp();
  startEventPoll();
  await startMedia('caller');   // offer waits in calls_events until the phone joins the bridge
  clearTimeout(ringTimeout);
  ringTimeout = setTimeout(async () => {
    if (call.phase !== 'active') {
      try { await sb.rpc('queue_end_call', { p_call_id: call.callId }); } catch (e) {}
      endCallLocal(isBridge ? 'tap-to-dial not used within 90 s' : 'no answer after 45 s');
    }
  }, (isBridge ? 90 : RING_TIMEOUT_S) * 1000);
}

/* inbound cellular call: answer on the phone itself (talk on the handset) */
async function answerOnPhone() {

  if (error) { setError(honestError(error)); return; }
  stopRing();
  incoming = null;
  call = { callId, phase: 'onphone', remoteName: fromName || 'unknown number', peerId: null, isGuest: false, isGateway: true,
           quality: 'unknown', rttMs: null, startedAt: Date.now(), routeNote: 'answered on your phone · your SIM', role: 'callee' };
  renderApp();
}

/* inbound cellular call: answer + bridge the audio into this browser */
async function answerWithBridge() {
  if (!incoming) return;
  const { callId, fromName } = incoming;
  const { error } = await sb.rpc('queue_answer_call', { p_call_id: callId });

  eventSeq = 0;

}

/* join the audio bridge later, from the onphone banner */

  call.startedAt = call.startedAt || Date.now();

/* ---------------- gateway phone in-call controls (1.5.5) ----------------
   Commands ride gateway_commands → the phone's GatewayService executes
   them via the InCallService (exact mute on Android 14+, bridge-mic
   fallback older). 1.5.4 phones answer call_state_probe with
   icsBound:false → we honestly say "update the app". */
async function gwCmd(kind, payload) {
  if (!gatewayOnline?.id) { showToast('No gateway device online'); return null; }
  const { data, error } = await sb.rpc('queue_gateway_command',
    { p_device_id: gatewayOnline.id, p_kind: kind, p_payload: payload || {} });
  if (error) { showToast('Command failed: ' + honestError(error)); return null; }
  return data;
}

async function gwToggleMute(btn) {
  if (!gatewayFull) { showToast('Update the phone app to the latest version for this'); return; }
  const want = !gatewayMute;
  const id = await gwCmd(want ? 'mute_call' : 'unmute_call');
  if (!id) return;
  gatewayMute = want;
  if (btn) btn.textContent = want ? 'Unmute phone' : 'Mute phone';
  showToast(want ? 'Phone mic muted' : 'Phone mic live');
}

async function gwToggleSpeaker(btn) {
  if (!gatewayFull) { showToast('Update the phone app to the latest version for this'); return; }
  const want = !gatewaySpeaker;
  const id = await gwCmd(want ? 'speaker_on' : 'speaker_off');
  if (!id) return;
  gatewaySpeaker = want;
  if (btn) btn.textContent = want ? 'Speaker off' : 'Speaker on';
  showToast(want ? 'Phone speaker ON (audio flows to browser)' : 'Phone speaker OFF (call is on the earpiece)');
}

async function gwToggleHold(btn) {
  if (!gatewayFull) { showToast('Update the phone app to the latest version for this'); return; }
  const want = !gatewayHeld;
  const id = await gwCmd(want ? 'hold_call' : 'resume_call');
  if (!id) return;
  gatewayHeld = want;
  renderApp();
  showToast(want ? 'Call on hold' : 'Call resumed');
}

/* gatewayOnStatus — exact call state pushed by the phone's InCallService */
function gatewayOnStatus(status) {
  if (!call.callId) return;
  if (status === 'ringing' && call.phase === 'dialing') { call.phase = 'ringing'; renderApp(); }
  if (status === 'answered' && (call.phase === 'dialing' || call.phase === 'ringing')) {
    clearTimeout(ringTimeout); ringTimeout = null;
    call.phase = 'active';
    renderApp();
  }
  if (['rejected','no_answer','failed','cancelled','completed'].includes(status)) {
    endCallLocal(status === 'completed' ? 'ended' : status.replace('_', ' '));
  }
}

async function endGatewayCall(reason) {
  clearTimeout(ringTimeout); ringTimeout = null;
  const id = call.callId;
  if (id) { try { await sendSignal('bye', {}); } catch (e) {} }
  endCallLocal(reason);
  if (id) { try { await sb.rpc('queue_end_call', { p_call_id: id }); } catch (e) {} }
}

/* ---------------- realtime wiring (user session) ---------------- */
function wireRealtime() {
  sb.removeChannel(liveChannel);
  liveChannel = sb.channel('live-' + me.id)
    // new call ringing for me
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls', filter: 'callee_id=eq.' + me.id },
      (payload) => {
        const c = payload.new;
        if (c.status !== 'ringing') return;
        // a real cellular call is ringing on my SIM (reported by the gateway phone)
        if (c.direction === 'inbound-pstn' || (c.caller_kind === 'pstn' && c.pstn_to)) {
          onIncoming(c.id, c.normalized_destination || c.pstn_to || 'unknown number', c.created_by, false, true);
          return;
        }
        onIncoming(c.id, c.caller_kind === 'guest' ? (c.guest_name || 'Guest') : null, c.created_by, c.caller_kind === 'guest');
      })
    // updates on calls I created
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: 'created_by=eq.' + me.id },
      (payload) => {
        if (call.callId && call.callId === payload.new.id) onCallUpdated(payload.new.status);
        // incoming (not yet accepted) call died (swept/rejected elsewhere) → clear banner
        if (incoming && incoming.callId === payload.new.id &&
            ['no_answer','cancelled','rejected','failed','completed'].includes(payload.new.status)) {
          incoming = null; stopRing(); renderApp();
        }
      })
    // updates on calls I receive
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'calls', filter: 'callee_id=eq.' + me.id },
      (payload) => { if (call.callId && call.callId === payload.new.id) onCallUpdated(payload.new.status); })
    // SMS via my gateway phone (in + out)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sms_messages', filter: 'user_id=eq.' + me.id },
      (payload) => {
        const m = payload.new;
        smsList = [m, ...smsList].slice(0, 50);
        showToast(m.direction === 'inbound' ? `💬 SMS from ${m.from_number}: ${m.body.slice(0, 40)}` : `💬 SMS queued to ${m.to_number}`);
        if (tab === 'sms') renderApp();
      })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sms_messages', filter: 'user_id=eq.' + me.id },
      (payload) => {
        const i = smsList.findIndex(x => x.id === payload.new.id);
        if (i >= 0) smsList[i] = payload.new; else smsList = [payload.new, ...smsList].slice(0, 50);
        if (tab === 'sms') renderApp();
      })
    // gateway phone presence (online/offline, battery)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gateway_devices', filter: 'user_id=eq.' + me.id },
      () => { refreshDevices(); })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { realtimeReady = true; stopBootPoll(); }
    });
}

/* fallback poll for incoming calls until realtime confirmed */
function startBootPoll() {
  stopBootPoll();
  bootPoll = setInterval(async () => {
    if (realtimeReady || call.phase !== 'idle' || incoming) return;
    const { data } = await sb.from('calls')
      .select('id, created_by, caller_kind, guest_name, status, direction, pstn_to, normalized_destination')
      .eq('callee_id', me.id).eq('status', 'ringing')
      .order('created_at', { ascending: false }).limit(1);
    const c = data && data[0];
    if (!c) return;
    if (c.direction === 'inbound-pstn' || (c.caller_kind === 'pstn' && c.pstn_to)) {
      onIncoming(c.id, c.normalized_destination || c.pstn_to || 'unknown number', c.created_by, false, true);
      return;
    }
    onIncoming(c.id, c.caller_kind === 'guest' ? (c.guest_name || 'Guest') : null, c.created_by, c.caller_kind === 'guest');
  }, 4000);
}
function stopBootPoll() { if (bootPoll) { clearInterval(bootPoll); bootPoll = null; } }

/* ---------------- incoming call ---------------- */
async function onIncoming(callId, fromName, fromId, isGuest, isGateway) {
  if (call.phase !== 'idle' || incoming) return;
  incoming = { callId, fromName: fromName || '', fromId, isGuest: !!isGuest, isGateway: !!isGateway };
  if (!incoming.fromName && fromId) {
    resolveName(fromId).then(n => { if (incoming && incoming.callId === callId) { incoming.fromName = n; renderApp(); } });
  }
  renderApp();
  ringIncoming();
}

let incomingRingSound = null;
function ringIncoming() {
  try {
    if (!incomingRingSound) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.frequency.value = 440; g.gain.value = 0.04;
      osc.connect(g); g.connect(ctx.destination); osc.start();
      incomingRingSound = { ctx, osc };
      setTimeout(stopRing, 30000);
    }
  } catch {}
}
function stopRing() {
  try { if (incomingRingSound) { incomingRingSound.osc.stop(); incomingRingSound.ctx.close(); } } catch {}
  incomingRingSound = null;
}

async function resolveName(profileId) {
  const { data } = await sb.from('profiles').select('display_name').eq('id', profileId).maybeSingle();
  return data?.display_name || 'User';
}

function onCallUpdated(status) {
  if (!call.callId) return;
  if (call.isGuest) return guestOnStatus(status);
  if (call.isGateway) return gatewayOnStatus(status);
  if (status === 'answered' && call.phase === 'ringing' && call.role === 'caller') {
    clearTimeout(ringTimeout); ringTimeout = null;
    call.phase = 'active'; call.startedAt = Date.now();
    renderApp();
    startMedia('caller');
  }
  if (['rejected','no_answer','failed','cancelled','completed'].includes(status)) {
    endCallLocal(status === 'completed' ? 'ended' : status.replace('_', ' '));
  }
}

/* ---------------- signaling ---------------- */
function sigRoomName(peerId) { return 'sig-' + [me?.id || 'guest', peerId].sort().join('-'); }

/* join (and keep) the per-call broadcast room */
function joinRoom(peerId) {
  const room = sigRoomName(peerId);
  if (roomChannel && roomChannel.topic === room) return Promise.resolve();
  sb.removeChannel(roomChannel); roomChannel = null;
  const ch = sb.channel(room, { config: { broadcast: { self: false } } });
  ch.on('broadcast', { event: 'signal' }, (msg) => {
    const p = msg.payload || {};
    if (p.from && p.from === (me?.id || 'guest')) return;   // ignore own
    handleSignal(p);
  });
  roomChannel = ch;
  return new Promise(res => { ch.subscribe(st => { if (st === 'SUBSCRIBED') res(); }); setTimeout(res, 1500); });
}
function leaveRoom() { if (roomChannel) { sb.removeChannel(roomChannel); roomChannel = null; } }

/* unified send: broadcast via room (if any) + durable row via RPC */
async function sendSignal(kind, data) {
  if (call.mySender == null) call.mySender = (me ? me.id : '00000000-0000-0000-0000-000000000000');
  try {
    if (roomChannel && roomChannel.state === 'joined') {
      await roomChannel.send({ type: 'broadcast', event: 'signal', payload: { kind, data, callId: call.callId, from: call.mySender, to: call.peerId || null } });
    }
  } catch {}
  try {
    await activeSb().rpc('post_call_event', { p_call_id: call.callId, p_kind: kind, p_payload: data });
  } catch {}
}

/* signals that arrive before the peer connection exists (gateway phone can
   offer the moment we register, before startMedia has created pc). They are
   queued here and drained by startMedia() — the old code silently dropped
   them and eventSeq advanced past, so the call connected with no audio. */
let pendingSignals = [];
/* ICE candidates that arrive before the remote SDP is set cannot be applied
   yet (addIceCandidate throws); buffer and flush after setRemoteDescription. */
let pendingIce = [];

function handleSignal(p) {
  if (!p || !p.kind) return;
  if (p.callId && call.callId && p.callId !== call.callId) return;
  if (!pc) { pendingSignals.push(p); return; }
  (async () => {
    try {
      if (p.kind === 'offer') {
        // fresh connection setup OR mid-call renegotiation (e.g. peer attached mic via Retry).
        // glare safety: only take an offer when we are not mid-negotiation ourselves.
        if (pc.signalingState === 'have-local-offer') return;         // collision — sender may retry
        if (pc.currentRemoteDescription && pc.remoteDescription.sdp === p.data.sdp) return; // duplicate delivery
        const isRenego = !!pc.currentRemoteDescription;               // already connected once
        await pc.setRemoteDescription(new RTCSessionDescription(p.data));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await waitIceGather(pc);
        await sendSignal('answer', pc.localDescription);
        if (isRenego) showToast('Peer microphone connected');
      } else if (p.kind === 'answer') {
        if (pc.signalingState !== 'have-local-offer') return;         // stale or duplicate answer
        await pc.setRemoteDescription(new RTCSessionDescription(p.data));
        flushPendingIce();
      } else if (p.kind === 'ice') {
        if (p.data && p.data.candidate) {
          if (!pc.remoteDescription) { pendingIce.push(p.data); return; }   // too early — hold it
          try { await pc.addIceCandidate(new RTCIceCandidate(p.data)); } catch {}
        }
      } else if (p.kind === 'bye') {
        endCallLocal('ended');
      }
    } catch (e) { console.warn('signal error', e); }
  })();
}

function flushPendingIce() {
  if (!pendingIce.length) return;
  const list = pendingIce; pendingIce = [];
  list.forEach(c => { try { pc && pc.addIceCandidate(new RTCIceCandidate(c)); } catch {} });
}

/* wait (briefly) for ICE gathering so SDP carries all candidates — non-trickle */
function waitIceGather(pconn, ms = 2500) {
  return new Promise(res => {
    if (pconn.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, ms);
    pconn.addEventListener('icegatheringstatechange', () => {
      if (pconn.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    });
  });
}

/* durable events drain: runs until ICE connects; also carries call status */
function startEventPoll() {
  stopEventPoll();
  pollTimer = setInterval(async () => {
    if (!call.callId) { stopEventPoll(); return; }
    try {
      const { data, error } = await activeSb().rpc('get_call_events', { p_call_id: call.callId, p_after_seq: eventSeq });
      if (!error) {
        for (const ev of (data || [])) {
          eventSeq = Math.max(eventSeq, ev.seq);
          const isMine = ev.sender === call.mySender;   // own events (echo) match my sender id
          if (ev.kind === 'offer') handleSignal({ kind: 'offer', data: ev.payload, callId: call.callId });
          else if (ev.kind === 'answer') handleSignal({ kind: 'answer', data: ev.payload, callId: call.callId });
          else if (ev.kind === 'ice' && !isMine) handleSignal({ kind: 'ice', data: ev.payload, callId: call.callId });
          else if (ev.kind === 'bye') endCallLocal('ended');
        }
      }
      if (call.phase === 'ringing') {
        const { data: st } = await activeSb().rpc('get_call_status', { p_call_id: call.callId });
        const row = st && st[0];
        if (row && row.status !== 'ringing') onCallUpdated(row.status);
      }
      if (pc && (pc.connectionState === 'connected') && call.phase === 'ringing') stopEventPoll();
      // NOTE: during active calls the poll keeps running — it carries mid-call
      // renegotiation (mic retry) and the bye for broadcast-less guest tabs.
    } catch {}
  }, 1200);
}
function stopEventPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ---------------- calls (user-to-user) ---------------- */
async function placeCall(dest) {
  if (call.phase !== 'idle') { showToast('Already in a call — end it first'); return; }
  const d = (dest || dial).trim();
  if (!d) return;
  const dst = d.includes('@') ? d.toLowerCase() : d.toLowerCase() + '@opencall';
  setError('');
  const { data, error } = await sb.rpc('place_call', { p_destination: dst, p_mode: 'human' });
  if (error) { setError(honestError(error)); return; }
  call = { callId: data.id, phase: 'ringing', remoteName: dst, peerId: data.callee_id, isGuest: false,
           quality: 'unknown', rttMs: null, startedAt: Date.now(), routeNote: 'FREE ON-NET · internet call', role: 'caller' };
  eventSeq = 0;
  renderApp();
  await joinRoom(data.callee_id);   // listen before we ever send
  startEventPoll();
  ringTimeout = setTimeout(async () => {
    if (call.phase === 'ringing') {
      try { await sb.rpc('no_answer_call', { p_call_id: call.callId }); } catch (e) {}
      endCallLocal('no answer after 45 s — they may be offline');
    }
  }, RING_TIMEOUT_S * 1000);
}

async function acceptIncoming() {
  if (!incoming) return;
  const { callId, fromId, isGuest, fromName } = incoming;
  stopRing();
  incoming = null;
  const { error } = await sb.rpc('answer_call', { p_call_id: callId });
  if (error) { setError(honestError(error)); renderApp(); return; }
  call = { callId, phase: 'active', remoteName: fromName || 'Caller', peerId: isGuest ? null : fromId, isGuest: !!isGuest,
           quality: 'unknown', rttMs: null, startedAt: Date.now(), routeNote: 'FREE ON-NET · internet call', role: 'callee' };
  eventSeq = 0;
  renderApp();
  if (!isGuest) await joinRoom(fromId);
  await startMedia('callee');
  startEventPoll();
}

async function answerIncoming(callId) {
  // used when banner shows a call whose incoming object was cleared or for re-accept; kept simple
  const { error } = await sb.rpc('answer_call', { p_call_id: callId });
  if (error) return setError(honestError(error));
}

async function rejectIncoming() {
  if (!incoming) return;
  stopRing();
  await sb.rpc('reject_call', { p_call_id: incoming.callId }).then(() => {}, () => {});
  incoming = null; renderApp();
}

async function hangup() {
  if (call.isPstn) return endPstnCall('ended');
  if (call.isGateway) return endGatewayCall('ended');
  const id = call.callId, peer = call.peerId, wasGuest = call.isGuest;
  const hadMedia = !!pc;
  if (hadMedia) { try { await sendSignal('bye', {}); } catch {} }
  endCallLocal('ended');
  if (id) await sb.rpc('hangup_call', { p_call_id: id, p_reason: 'hangup' }).then(() => {}, () => {});
}

function endCallLocal(reason) {
  clearTimeout(ringTimeout); ringTimeout = null;
  clearInterval(statsTimer); statsTimer = null;
  stopEventPoll();
  stopRing();
  stopRecordingAndSave();   // 1.5.7: encode + upload what we captured (async, non-blocking)
  leaveRoom();
  if (pc) { try { pc.close(); } catch {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteAudio.srcObject = null;
  pendingSignals = []; pendingIce = [];   // drop any signals queued for the dead call
  muteState = false;
  gatewayMute = false; gatewaySpeaker = true; gatewayHeld = false;
  dtmfOpen = false;
  const dur = call.startedAt ? Math.round((Date.now() - call.startedAt) / 1000) : 0;
  call = { callId:null, phase:'idle', remoteName:'', peerId:null, isGuest:false,
           quality:'unknown', rttMs:null, startedAt:null, routeNote:'', role:null };
  if (me) renderApp(); else renderGuestIdle();
  if (me) refreshHistory();
  showToast(dur > 5 ? `Call ${reason} · lasted ${fmtDur(dur)}` : `Call ${reason}`);
}

/* ---------------- WebRTC (real P2P audio) ---------------- */
const RTC_CONFIG = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ] };

/* mic acquisition with an honest timeout: a hung device must not stall the call forever */
function getMic(ms = 15000) {
  return new Promise((resolve) => {
    let settled = false;
    const done = (ok, val) => { if (!settled) { settled = true; clearTimeout(timer); resolve(ok ? val : null); } };
    const timer = setTimeout(() => done(false, 'timeout'), ms);
    navigator.mediaDevices.getUserMedia({ audio: true, echoCancellation: true, noiseSuppression: true })
      .then(s => done(true, s))
      .catch(e => done(false, e && e.name ? e.name : 'error'));
  });
}

async function retryMic(btn) {
  if (btn) btn.disabled = true;
  if (btn) btn.textContent = 'Trying mic…';
  const s = await getMic(12000);
  if (s && pc && call.phase === 'active') {
    localStream = s;
    s.getTracks().forEach(t => pc.addTrack(t, s));
    try {                                   // renegotiate so the peer starts receiving us
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGather(pc);
      await sendSignal('offer', pc.localDescription);
    } catch {}
    call.stateNote = '';
    renderApp();
    showToast('Microphone connected');
  } else {
    if (btn) { btn.disabled = false; btn.textContent = 'Retry mic'; }
    showToast('still no microphone — you are in listen-only mode');
  }
}
window.retryMic = retryMic;

async function startMedia(role) {
  localStream = await getMic(15000);
  if (localStream) {
    call.stateNote = '';
  } else {
    // honest degradation: connect audio anyway so the other side is heard; say exactly what happened
    call.stateNote = 'no microphone — listen-only (you can hear them, they cannot hear you)';
  }
  renderApp();
  pc = new RTCPeerConnection(RTC_CONFIG);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  else pc.addTransceiver('audio', { direction: 'recvonly' });   // valid SDP so listen-only still connects
  pc.ontrack = (e) => {
    remoteAudio.srcObject = e.streams[0]; remoteAudio.play().catch(() => {});
    // 1.5.7: capture both voices once the far end starts flowing
    startRecordingIfPossible(localStream);
  };
  pc.onconnectionstatechange = () => {
    if (pc && ['failed','disconnected','closed'].includes(pc.connectionState) && call.phase === 'active') {
      endCallLocal('connection lost');
    }
  };
  pc.onicecandidate = (e) => {
    // non-trickle main path: candidates ride inside offer/answer SDP.
    // late candidates still go out, best-effort:
    if (e.candidate) sendSignal('ice', e.candidate.toJSON());
  };

  // drain any offer/answer/ICE that arrived before this pc existed
  if (pendingSignals.length) { const q = pendingSignals; pendingSignals = []; q.forEach(handleSignal); }

  if (role === 'caller') {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceGather(pc);
    await sendSignal('offer', pc.localDescription);
  }
  // callee: offer arrives via room broadcast or durable poll; answer sent on receipt

  statsTimer = setInterval(async () => {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      stats.forEach(s => {
        if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.currentRoundTripTime != null) {
          call.rttMs = Math.round(s.currentRoundTripTime * 1000);
          call.quality = call.rttMs < 150 ? 'excellent' : call.rttMs < 400 ? 'good' : 'poor';
          updateQualityUI();
        }
      });
    } catch {}
  }, 4000);
}

function updateQualityUI() {
  const q = document.querySelector('.qdot'); if (q) q.className = 'qdot ' + call.quality;
  const rt = document.querySelector('.rtt'); if (rt) rt.textContent = String(call.rttMs ?? '…');
  const lbl = document.querySelector('.qlabel'); if (lbl) lbl.textContent = call.quality === 'unknown' ? 'connecting…' : call.quality;
}

function toggleMute(btn) {
  muteState = !muteState;
  if (call.isPstn) {                       // Twilio manages its own mic stream
    try { if (activeTwilioCall) activeTwilioCall.mute(muteState); } catch {}
    btn.textContent = muteState ? 'Unmute' : 'Mute';
    return;
  }
  if (!localStream) { muteState = false; return; }
  localStream.getAudioTracks().forEach(t => t.enabled = !muteState);
  btn.textContent = muteState ? 'Unmute' : 'Mute';
}

/* ---------------- history / contacts / sweep ---------------- */
/* BLINK FIX: background refreshers (history / sms / devices / contacts) used to
   call renderApp() unconditionally after every poll or realtime heartbeat.
   renderApp() tears down the whole DOM and rebuilds it — the page visibly
   "blinked" every time the Android heartbeated (every few seconds) because the
   gateway_devices UPDATE handler called refreshDevices() → renderApp().
   These helpers snapshot the data; a re-render happens ONLY when content truly
   changed. Deep-compare is safe here: rows are small (≤50 items). */
function snap(v) { try { return JSON.stringify(v); } catch { return String(v); } }
/* STALE-DEVICE FIX: the DB `online` flag only flips false on a clean unregister.
   If the app is deleted / killed / phone is off, the row stays online=true forever.
   A device counts as ONLINE only when the DB flag is true AND the heartbeat is
   fresh (≤ 2 min). Everything else is rendered honestly as offline. */
function deviceFresh(d, cutoffMs) {
  const seen = d.last_seen_at ? new Date(d.last_seen_at).getTime() : 0;
  return !!d.online && seen > cutoffMs;
}
async function refreshHistory() {
  if (!me) return;
  const { data } = await sb.from('calls')
    .select('id, requested_destination, normalized_destination, status, duration_seconds, created_at, caller_kind, guest_name, created_by, callee_id, route_type, recording_url')
    .or(`created_by.eq.${me.id},callee_id.eq.${me.id}`)
    .order('created_at', { ascending: false })
    .limit(30);
  const next = data || [];
  if (snap(next) !== snap(history)) { history = next; renderApp(); }   // re-render only on real change
}

/* 1.5.7: signed-URL playback for a call recording (bucket is private) */
const recUrlCache = new Map();   // callId → { url, at }
async function recordingUrl(callId, path) {
  const hit = recUrlCache.get(callId);
  if (hit && Date.now() - hit.at < 50 * 60 * 1000) return hit.url;   // signed for 60 min
  const { data, error } = await sb.storage.from('call-recordings').createSignedUrl(path, 3600);
  if (error || !data?.signedUrl) { showToast('Recording unavailable: ' + honestError(error || { message: 'not found' })); return null; }
  recUrlCache.set(callId, { url: data.signedUrl, at: Date.now() });
  return data.signedUrl;
}
async function playRecording(callId, path, btn) {
  const url = await recordingUrl(callId, path);
  if (!url) return;
  const holder = document.getElementById('rec-play');
  if (!holder) return;
  holder.innerHTML = `<audio controls autoplay src="${url}" style="width:100%;margin-top:8px"></audio>`;
  btn && (btn.textContent = '▮▮ Close player');
  btn && (btn.onclick = () => { holder.innerHTML = ''; btn.textContent = '▶ Play recording'; btn.onclick = () => playRecording(callId, path, btn); });
}
async function downloadRecording(callId, path) {
  const url = await recordingUrl(callId, path);
  if (!url) return;
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `opencall-${callId.slice(0, 8)}.mp3`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch { window.open(url, '_blank'); }
}

async function refreshContacts() {
  const { data } = await sb.from('profiles').select('*').neq('id', me.id).order('display_name');
  const next = data || [];
  if (snap(next) !== snap(contacts)) { contacts = next; renderApp(); }   // re-render only on real change
}

async function sweep() {

/* keypad wiring: taps append to the dial string and refresh route UI in place */
function wireDialKeys() {
  const wrap = document.getElementById('dial-display');
  if (!wrap) return;
  document.querySelectorAll('.key').forEach(k => {
    k.addEventListener('click', () => dialEdit((dial || '') + k.dataset.digit));
  });
}
/* central dial-string editor: updates input, estimate and call button without a full re-render */
function dialEdit(v) {
  dial = v;
  const inp = document.getElementById('dial-input');
  if (inp) { inp.value = dial; inp.focus(); }
  updateEstimate();
  // refresh the Route card honestly (gateway/pstn state may have flipped the route)
  const est = document.getElementById('estimate');
  if (est) est.innerHTML = estimateFor(dial);
  const btn = document.getElementById('btnCall');
  if (btn) { if (canCall(dial)) btn.removeAttribute('disabled'); else btn.setAttribute('disabled', ''); }
  const dels = document.querySelectorAll('.main .btn-ghost.tiny');
  dels.forEach(b => { if (b.textContent.includes('⌫') || b.textContent.includes('Clear')) b.disabled = !dial.length; });
}

function onCallClick() {
  const d = (dial || '').trim();
  if (/^\+?\d[\d\s()-]{5,}$/.test(d)) {
    if (gatewayOnline && !forceTwilio) return placeGatewayCall(d);   // free first
    if (pstnConfigured) return placePstnCall(d);                     // paid fallback
    return setError('No phone route: pair your Android in Devices, or configure Twilio.');
  }
  placeCall(d);
}

function smsPill(m) {
  const s = m.status || '';
  const cls = s === 'failed' ? 'failed' : (s === 'sent' || s === 'delivered') ? 'sent'
            : (s === 'queued' || s === 'pending') ? 'queued' : 'completed';
  // bridge handoff: the message stays 'queued' until the user taps and sends
  const handoff = gatewayFlavor === 'bridge' && s === 'queued'
    ? ' · <span style="color:#fcd34d">tap the notification on your phone to send</span>' : '';
  return `<span class="pill ${cls}">${esc(s || 'unknown')}</span>${handoff}`;
}
function relTime(ts) {
  if (!ts) return 'never';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function connectExample(kind, keyRef) {
  const K = keyRef || '<YOUR_API_KEY>';
  const B = 'https://ijrfqjxdajgoaysazxle.supabase.co/rest/v1/rpc';
  const ANON = SUPABASE_ANON_KEY;
  if (kind === 'status') return `curl -X POST '${B}/api_status' \\
  -H 'apikey: ${ANON}' \\
  -H 'Content-Type: application/json' \\
  -d '{"p_key":"${K}"}'`;
  if (kind === 'sms') return `curl -X POST '${B}/api_send_sms' \\
  -H 'apikey: ${ANON}' \\
  -H 'Content-Type: application/json' \\
  -d '{"p_key":"${K}","p_to":"+995599123456","p_body":"Hello from my app!"}'`;
  if (kind === 'getsms') return `curl -X POST '${B}/api_get_sms' \\
  -H 'apikey: ${ANON}' \\
  -H 'Content-Type: application/json' \\
  -d '{"p_key":"${K}","p_limit":20}'`;
  if (kind === 'call') return `curl -X POST '${B}/api_place_call' \\
  -H 'apikey: ${ANON}' \\
  -H 'Content-Type: application/json' \\
  -d '{"p_key":"${K}","p_to":"+995599123456"}'
# → returns the call id; your phone starts dialing immediately`;
  if (kind === 'poll') return `curl -X POST '${B}/api_get_call' \\
  -H 'apikey: ${ANON}' \\
  -H 'Content-Type: application/json' \\
  -d '{"p_key":"${K}","p_call_id":"<call id from step 4>"}'
# status: created → dialing → ringing → answered → ended (duration_seconds set)`;
  return '';
}

/* guest media: guest is the offerer; everything rides the durable events path */
async function guestMedia() {
  localStream = await getMic(15000);
  if (!localStream) {
    call.stateNote = 'no microphone — listen-only (you can hear Alice, she cannot hear you)';
    renderGuestActive();
  }
  pc = new RTCPeerConnection(RTC_CONFIG);
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  else pc.addTransceiver('audio', { direction: 'recvonly' });   // valid SDP so listen-only still connects
  pc.ontrack = (e) => {
    remoteAudio.srcObject = e.streams[0]; remoteAudio.play().catch(() => {});
    startRecordingIfPossible(localStream);   // 1.5.7: record both voices
  };
  pc.onconnectionstatechange = () => {
    if (pc && ['failed','disconnected','closed'].includes(pc.connectionState) && call.phase === 'active') endCallLocal('connection lost');
  };
  pc.onicecandidate = (e) => { if (e.candidate) sendSignal('ice', e.candidate.toJSON()); };

  // drain any offer/answer/ICE that arrived before this pc existed (guest path)
  if (pendingSignals.length) { const q = pendingSignals; pendingSignals = []; q.forEach(handleSignal); }

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceGather(pc);
  await sendSignal('offer', pc.localDescription);

  const stats = setInterval(async () => {
    if (!pc) { clearInterval(stats); return; }
    try {
      const r = await pc.getStats();
      r.forEach(s => {
        if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.currentRoundTripTime != null) {
          call.rttMs = Math.round(s.currentRoundTripTime * 1000);
          call.quality = call.rttMs < 150 ? 'excellent' : call.rttMs < 400 ? 'good' : 'poor';
          updateQualityUI();
        }
      });
    } catch {}
  }, 4000);
}

/* ---------------- router ---------------- */
window.addEventListener('hashchange', route);

function route() {
  const h = location.hash;
  const m = h.match(/^#\/guest\/([a-f0-9]+)/);
  if (m) { guestJoin(m[1]); return; }
  boot();
}

route();
</script>
